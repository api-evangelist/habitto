name: Habitto
description: Habitto is a Tokyo-based fintech company building a mobile financial wellness
  app for the Japanese market under the banner お金の新習慣 ("new money habits"). The app pairs a
  high-yield savings account and a cashback debit card with access to human financial advisors
  who help users save, grow, and protect their money. Habitto is backed by the fintech-focused
  venture investors Anthemis and QED Investors. This API Evangelist profile has been enriched
  with company identity, website link properties, and a domain-security probe; Habitto is a
  consumer-facing product and publishes no public developer API, SDKs, or API documentation.
